<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 214" role="img" aria-labelledby="t d">
<title id="t">Training at frontier labs stretches a language model agent's distribution of next steps into software that runs. A harness a human can read bends it toward good software</title>
<desc id="d">Four panels share one state (dot) and a ring marking the goal, good software. The first three also show a dashed region of software that runs, with the goal inside it. Each panel draws, as a jagged ball, the distribution of next steps that the language model and its harness induce from the state, and one draw from it, a leap, as a line to a landing dot. All four balls share one ragged core, so only the spikes and the place of the mass change. Training moves the mass outward: in pretraining it sits in a dense core, and in reinforcement learning and the harness it sits out along long arms around a pale core. Three panels sit under the heading 'trained into the weights by frontier labs'. In pretraining, fourteen short spikes point in every direction and the draw is short. In fine-tuning, five spikes point in fewer directions and reach farther. In reinforcement learning, three long tapered arms reach into the region that runs, all of them on one side of the goal and none at it, and the draw lands in that region far from the goal. Labs also train toward what people generally want from software, from human preferences, but all of this training happens before the agent meets this project, so none of it can aim at this goal. The last panel, types, tests, and plans, sits under 'built into the harness'. Shaded walls of types, tests, and benchmarks bound a corridor from the state to the goal. The walls slice the distribution: inside the corridor it keeps its density, and past the walls it shows only as a faint dashed outline, mass the harness removes. A faint red band, the plan a human holds, runs along the corridor, and one arm follows it toward the goal. The draw lands at the end of that arm near the goal, inside a red ball with a red ring: a human reading the draw and accepting it.</desc>
